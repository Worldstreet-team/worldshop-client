<!doctype html>
<!-- data-ws-theme selects the palette. "worldstreet" matches the WorldStreet
     dashboard: near-black, lime #C9DD25, Public Sans (src/styles/_worldstreet.scss).
     Two alternatives stay maintained, each one attribute away: "shop" (espresso +
     coral, _tokens.scss + _shop.scss) and "market" (paper + olive, _market.scss).
     If you switch, change theme-color below too. -->
<html lang="en" data-ws-theme="worldstreet">

<head>
  <meta charset="UTF-8" />
  <!-- Every icon here is the gold W on black, the header logo (brand/wsa-tile.png). The .ico and
       PNGs show the same mark, so whichever one a browser picks, the tab
       shows the same logo; regenerate all of them if it changes. The
       apple-touch icon is full-bleed and opaque because iOS masks the corners
       itself and paints transparency black. -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Sanctioned literal: mirrors --ws-bg-page (worldstreet; shop is #0F0C0A, market #EEEEEC) — a meta tag cannot
       read a CSS variable. Keep in sync with src/shared/utils/theme.ts. -->
  <meta name="theme-color" content="#050505" />

  <!-- The market theme has no dark counterpart yet, so the stored
       platform/platform-light choice is ignored rather than applied: honouring
       it would drop a returning user onto the old dark palette. Restore this
       block together with the toggle when market gains a dark mode. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Buy and sell phones, fashion, vehicles, home goods and more across Nigeria. Browse local stores, compare prices and chat with sellers directly on WorldStore." />
  <title>WorldStore — Buy &amp; sell across Nigeria</title>

  <!-- Link previews (WhatsApp, Facebook, X, LinkedIn). These are site-wide
       defaults: crawlers that do not run JavaScript only ever see these. The
       canonical link is set per page by src/app/useCanonical.ts, since a fixed
       one here would mark every page as a copy of the homepage. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="WorldStore" />
  <meta property="og:title" content="WorldStore — Buy & sell across Nigeria" />
  <meta property="og:description"
    content="Browse local stores, compare prices and chat with sellers directly." />
  <meta property="og:url" content="https://shop.worldstreetgold.com/" />
  <meta property="og:image" content="https://shop.worldstreetgold.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="WorldStore: buy and sell directly with sellers across Nigeria" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WorldStore — Buy & sell across Nigeria" />
  <meta name="twitter:description" content="Browse local stores, compare prices and chat with sellers directly." />
  <meta name="twitter:image" content="https://shop.worldstreetgold.com/og-image.png" />
  <link rel="canonical" href="https://shop.worldstreetgold.com/" />

  <!-- Only the active theme's fonts: Public Sans for text, IBM Plex Mono for
       figures. Switching data-ws-theme above means adding that theme's family
       here too (shop: Space Grotesk + Inter; market: Instrument Sans). Loading
       all five cost about 1.6 MB on every first visit. The Noto Sans request
       is the naira sign only, as a fallback for any face without it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&text=%E2%82%A6" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
