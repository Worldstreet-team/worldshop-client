<!doctype html>
<!-- data-ws-theme selects the palette in src/styles/_tokens.scss. Shop ships
     on the Platform theme shared with Academy/Social/Vision/Arcade: near-black
     #0B0B0F + gold #FFCC29, Poppins + Public Sans. Users can toggle
     "platform-light" (see the inline script below and src/utils/theme.ts).
     The legacy "shop" (espresso + coral) and "shop-light" (paper) modes remain
     in the token file. -->
<html lang="en" data-ws-theme="platform">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Sanctioned literal: mirrors --ws-bg-page (platform) — a meta tag cannot
       read a CSS variable. Keep in sync with src/utils/theme.ts. -->
  <meta name="theme-color" content="#0B0B0F" />

  <!-- Apply the stored theme before first paint so a light-mode user never
       sees a dark flash. Key/values mirrored in src/utils/theme.ts; the
       #FAFAFA literal mirrors --ws-bg-page (platform-light). -->
  <script>
    try {
      var wsTheme = localStorage.getItem('ws:theme');
      if (wsTheme === 'platform-light') {
        document.documentElement.setAttribute('data-ws-theme', wsTheme);
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', '#FAFAFA');
      }
    } catch (e) { /* private mode: default theme stands */ }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WorldShop — buy and sell directly with sellers across Nigeria." />
  <title>WorldShop — Marketplace</title>

  <!-- Platform theme pairing from the design system: Poppins display,
       Public Sans UI. Weights are exactly the ones the type ramp uses. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
