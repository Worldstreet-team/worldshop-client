<!doctype html>
<!-- data-ws-theme selects the palette in src/styles/_tokens.scss. Shop is
     dark-first: warm espresso #0F0C0A + coral #F0502F, Space Grotesk + Inter.
     Switch to "shop-light" for the original paper palette. -->
<html lang="en" data-ws-theme="shop">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#FAF9F5" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WorldShop — buy and sell directly with sellers across Nigeria." />
  <title>WorldShop — Marketplace</title>

  <!-- Shop theme pairing from the design system: Space Grotesk display,
       Inter UI. Weights are exactly the ones the type ramp uses. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
