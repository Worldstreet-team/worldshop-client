<!doctype html>
<!-- data-ws-theme selects the palette. "market" is the marketplace design
     from the sandbox, defined in src/styles/_market.scss: paper #F7F7F5, olive
     gold #8C9D15 for actions, burnt orange #C2410C as the domain accent,
     Instrument Sans. Set this back to "platform" to return to the dark
     near-black + #FFCC29 theme in src/styles/_tokens.scss, which is still
     intact along with the legacy "shop" modes. -->
<html lang="en" data-ws-theme="market">

<head>
  <meta charset="UTF-8" />
  <!-- The SVG mark first: it is the current WorldStore logo and scales to any
       size. The .ico and PNGs below are the previous brand, kept only as a
       fallback for browsers without SVG favicon support; regenerate them from
       wstore-mark.svg when there is tooling to hand. -->
  <link rel="icon" type="image/svg+xml" href="/brand/wstore-mark.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Sanctioned literal: mirrors --ws-bg-page (market) — a meta tag cannot
       read a CSS variable. Keep in sync with src/shared/utils/theme.ts. -->
  <meta name="theme-color" content="#F7F7F5" />

  <!-- The market theme has no dark counterpart yet, so the stored
       platform/platform-light choice is ignored rather than applied: honouring
       it would drop a returning user onto the old dark palette. Restore this
       block together with the toggle when market gains a dark mode. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WorldStore — buy and sell directly with sellers across Nigeria." />
  <title>WorldStore — Marketplace</title>

  <!-- Market theme pairing, matching the sandbox: Instrument Sans throughout,
       IBM Plex Mono for figures. The Noto Sans request is the naira sign only,
       which Instrument Sans does not carry. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&text=%E2%82%A6" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
